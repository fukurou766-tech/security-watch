
name: Daily Security Watch

on:
  workflow_dispatch:
  schedule:
    # 毎朝8:30（日本時間）= 前日23:30（UTC）
    - cron: '30 23 * * *'

permissions:
  contents: write

concurrency:
  group: security-watch-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch security information
        run: python update.py

      - name: Generate Japanese report
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python report.py

      - name: Save updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- REPORT.md data.json translation_cache.json

          if ! git diff --cached --quiet; then
            git commit -m "Update daily security report"
            git push
          fi
