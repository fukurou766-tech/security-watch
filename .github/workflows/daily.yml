name: Daily Security Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'

permissions:
  contents: write

concurrency:
  group: security-watch-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free translation library
        run: python -m pip install 'deep-translator==1.11.4'
      - name: Fetch security information
        run: python update.py
            - name: Generate Japanese report
        env:
          DEEPL_API_KEY: $&#123;&#123;                secrets.DEEPL_API_KEY &#125;&#125;
        run: python report.py
      - name: Save report and translation cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REPORT.md data.json translation_cache.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily security report (Japanese)'
            git push
            fi
